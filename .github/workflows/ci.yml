
name: CI - Frontend

on:
  push:
    branches:
      - main
      - master
      - feature/ci

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  qualidade-e-testes:
    name: TypeScript, ESLint, Build e Cypress
    runs-on: ubuntu-latest

    env:
      CI: "true"
      NEXT_PUBLIC_API_URL: https://sistema-reserva-salas-api.onrender.com

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar TypeScript
        run: npx tsc --noEmit

      - name: Executar ESLint
        run: npm run lint

      - name: Build do Next.js
        run: npm run build

      
      - name: Testes E2E
        uses: cypress-io/github-action@v6
        with:
          install: false
          command: npx cypress run --browser chrome
        env:
          CYPRESS_TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          CYPRESS_TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        env:
          CYPRESS_baseUrl: https://sistema-reserva-salas-ten.vercel.app

      - name: Salvar evidências do Cypress
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-evidencias
          path: |
            cypress/screenshots/**
            cypress/videos/**
          if-no-files-found: ignore

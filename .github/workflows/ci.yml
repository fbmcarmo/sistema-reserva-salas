
name: CI - Frontend

on:
  push:
    branches:
      - main
      - master
      - feature/ci

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  qualidade-e-testes:
    name: TypeScript, ESLint, Build e Cypress
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      CI: "true"

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar TypeScript
        run: npx tsc --noEmit

      - name: Executar ESLint
        run: npm run lint

      - name: Build do Next.js
        run: npm run build

      - name: Iniciar Next.js
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > next.log 2>&1 &
          echo $! > next.pid

      - name: Aguardar Next.js
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3000; then
              echo "Next.js iniciado com sucesso!"
              exit 0
            fi

            if ! kill -0 "$(cat next.pid)" 2>/dev/null; then
              echo "O processo Next.js foi encerrado."
              cat next.log
              exit 1
            fi

            sleep 2
          done

          echo "Timeout aguardando Next.js."
          cat next.log
          exit 1

      - name: Executar testes Cypress
        uses: cypress-io/github-action@v6
        with:
          install: false
          command: npx cypress run
        env:
          CYPRESS_baseUrl: http://127.0.0.1:3000

      - name: Exibir logs do Next.js em caso de falha
        if: failure()
        run: |
          if [ -f next.log ]; then
            cat next.log
          fi

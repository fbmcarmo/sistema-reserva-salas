
name: CI - Frontend

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  qualidade-e-testes:
    name: TypeScript, ESLint, Build e Cypress
    runs-on: ubuntu-latest

    env:
      CI: "true"
      NEXT_PUBLIC_API_URL: https://sistema-reserva-salas-api.onrender.com

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar TypeScript
        run: npx tsc --noEmit

      - name: Executar ESLint
        run: npm run lint

      - name: Build do Next.js
        run: npm run build

      - name: Executar testes E2E com Cypress
        uses: cypress-io/github-action@v6
        with:
          install: false
          command: npx cypress run --browser chrome
        env:
          CYPRESS_TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          CYPRESS_TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          CYPRESS_baseUrl: https://sistema-reserva-salas-ten.vercel.app

      - name: Salvar evidências do Cypress
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-evidencias
          path: |
            cypress/screenshots/**
            cypress/videos/**
          if-no-files-found: ignore

  validar-docker:
    name: Validar Docker
    runs-on: ubuntu-latest
    needs: qualidade-e-testes

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagem Docker do frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: sistema-reserva-salas-frontend:ci
          build-args: |
            NEXT_PUBLIC_API_URL=https://sistema-reserva-salas-api.onrender.com
          cache-from: type=gha
          cache-to: type=gha,mode=max
